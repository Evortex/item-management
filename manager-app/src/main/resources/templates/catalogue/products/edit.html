<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактировать товар</title>
</head>
<body>
<a data-th-href="@{/catalogue/products/{productId}(productId=${product.id})}">К списку товаров</a>
<h1>Редактировать товар [[${product.title}]]</h1>
<div data-th-if="${errors}">
    <h2>Допущенные ошибки</h2>
    <ul>
        <li data-th-each="error: ${erros}" data-th-text="${error}"></li>
    </ul>
</div>
<form method="post" data-th-action="@{catalogue/products/{productId}(productId=${product.id})}">
    <label>
        Название:<br>
        <input type="text" name="title" data-th-value="${payload != null ? payload.title(): product.title}">
    </label><br>
    <label>
        Описание:<br>
        <textarea name="details" data-th-text="${payload != null ? payload.details(): product.details}"></textarea>
    </label><br>
    <button type="submit">Изменить</button>
</form>
</body>
</html>
